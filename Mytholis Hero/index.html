<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mytholis — Transmutation Atelier</title>
<style>
    :root {
        color-scheme: dark;
        --accent-a: 236, 197, 120;
        --accent-b: 186, 132, 58;
        --glass-border: rgba(255, 226, 180, 0.16);
        --muted: rgba(240, 232, 220, 0.62);
    }
    * { box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: #050308;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    body::before {
        content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(circle at 50% 42%, rgba(var(--accent-a), 0.07), transparent 30%),
            radial-gradient(circle at 20% 10%, rgba(var(--accent-b), 0.05), transparent 26%),
            linear-gradient(180deg, rgba(14, 9, 24, 0.25), rgba(0, 0, 0, 0.22));
        transition: background 900ms ease;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass-panel {
        border: 1px solid var(--glass-border);
        background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025)), rgba(8, 4, 14, 0.5);
        box-shadow: 0 18px 60px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.13);
        backdrop-filter: blur(18px) saturate(145%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
    }
    #brand { position: fixed; top: 18px; left: 20px; z-index: 4; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    #brand-mark {
        width: 9px; height: 9px; border-radius: 50%;
        background: rgb(var(--accent-a));
        box-shadow: 0 0 10px rgba(var(--accent-a), 0.95), 0 0 30px rgba(var(--accent-b), 0.55);
        transition: background 700ms ease, box-shadow 700ms ease;
    }
    #brand-copy { display: grid; gap: 2px; }
    #brand-title { color: rgba(255, 250, 244, 0.94); font-size: 11px; font-weight: 650; letter-spacing: 0.18em; text-transform: uppercase; }
    #brand-subtitle { color: rgba(235, 220, 200, 0.47); font-size: 9px; letter-spacing: 0.11em; text-transform: uppercase; }
    #planet-copy {
        position: fixed; left: clamp(20px, 4vw, 64px); bottom: clamp(104px, 13vh, 156px);
        z-index: 4; width: min(390px, calc(100vw - 40px)); pointer-events: none;
        text-shadow: 0 4px 26px rgba(0,0,0,0.85);
    }
    #planet-kicker { margin-bottom: 7px; color: rgb(var(--accent-a)); font-size: 10px; font-weight: 650; letter-spacing: 0.22em; text-transform: uppercase; transition: color 700ms ease; }
    #planet-name { margin: 0; color: #fffaf2; font-size: clamp(34px, 5vw, 66px); font-weight: 300; line-height: 0.94; letter-spacing: -0.045em; }
    #planet-description { max-width: 360px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; letter-spacing: 0.012em; }
    #transition-meter { position: relative; width: min(260px, 68vw); height: 2px; margin-top: 18px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,0.1); opacity: 0; transform: translateY(4px); transition: opacity 280ms ease, transform 280ms ease; }
    #transition-meter.is-active { opacity: 1; transform: translateY(0); }
    #transition-meter-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: inherit; background: linear-gradient(90deg, rgb(var(--accent-a)), rgb(var(--accent-b))); box-shadow: 0 0 14px rgba(var(--accent-a), 0.65); }
    #planet-ui { position: fixed; left: 50%; bottom: 18px; z-index: 5; display: flex; align-items: center; gap: 7px; width: max-content; max-width: calc(100vw - 24px); padding: 7px; border-radius: 16px; transform: translateX(-50%); }
    #planet-ui button {
        appearance: none; min-width: 96px; height: 40px; padding: 0 13px;
        border: 1px solid rgba(255, 235, 200, 0.13); border-radius: 11px; outline: none;
        color: rgba(255, 244, 226, 0.63); background: rgba(255,255,255,0.035);
        font: 560 11px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer;
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }
    #planet-ui button:hover { color: rgba(255,255,255,0.96); border-color: rgba(255, 240, 220, 0.26); background: rgba(255,255,255,0.08); transform: translateY(-1px); }
    #planet-ui button:focus-visible { box-shadow: 0 0 0 2px rgba(var(--accent-a), 0.38); }
    #planet-ui button.is-active {
        color: #ffffff; border-color: rgba(var(--accent-a), 0.48);
        background: linear-gradient(135deg, rgba(var(--accent-a), 0.23), rgba(var(--accent-b), 0.12)), rgba(255,255,255,0.05);
        box-shadow: 0 0 26px rgba(var(--accent-a), 0.13), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    #planet-ui button.is-target { color: rgba(255,255,255,0.96); border-color: rgba(var(--accent-b), 0.46); }
    #auto-control { position: fixed; right: 18px; top: 17px; z-index: 5; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 13px; color: rgba(250, 235, 219, 0.58); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    #auto-control input { position: absolute; opacity: 0; pointer-events: none; }
    #auto-indicator { position: relative; width: 28px; height: 15px; border: 1px solid rgba(255, 235, 200, 0.2); border-radius: 99px; background: rgba(255,255,255,0.06); transition: border-color 180ms ease, background 180ms ease; }
    #auto-indicator::after { content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 238, 225, 0.52); transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease; }
    #auto-control input:checked + #auto-indicator { border-color: rgba(var(--accent-a), 0.42); background: rgba(var(--accent-a), 0.12); }
    #auto-control input:checked + #auto-indicator::after { transform: translateX(13px); background: rgb(var(--accent-a)); box-shadow: 0 0 10px rgba(var(--accent-a), 0.72); }
    #hint { position: fixed; right: 18px; bottom: 20px; z-index: 4; color: rgba(255,244,226,0.35); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; pointer-events: none; }
    @media (max-width: 760px) {
        #planet-copy { left: 18px; bottom: 126px; }
        #planet-name { font-size: clamp(38px, 12vw, 58px); }
        #planet-description { max-width: min(330px, calc(100vw - 36px)); font-size: 12px; }
        #planet-ui { bottom: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: calc(100vw - 24px); }
        #planet-ui button { min-width: 0; height: 38px; }
        #auto-control { top: 13px; right: 12px; }
        #hint { display: none; }
    }
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<div id="canvas-container" aria-hidden="true"></div>

<div id="brand">
    <span id="brand-mark"></span>
    <div id="brand-copy">
        <span id="brand-title">Mytholis Parfums</span>
        <span id="brand-subtitle">Realtime transmutation atelier</span>
    </div>
</div>

<label id="auto-control" class="glass-panel" title="Automatically pour the next colourway">
    <span>Auto</span>
    <input id="auto-cycle" type="checkbox" checked>
    <span id="auto-indicator" aria-hidden="true"></span>
</label>

<section id="planet-copy" aria-live="polite">
    <div id="planet-kicker">Lacquered noir flacon</div>
    <h1 id="planet-name">Terra Petra</h1>
    <p id="planet-description">Obsidian glass crowned with polished gold — the mineral heart of stone, amber and sun-baked earth.</p>
    <div id="transition-meter" aria-hidden="true"><div id="transition-meter-fill"></div></div>
</section>

<nav id="planet-ui" class="glass-panel" aria-label="Colourways">
    <button type="button" class="is-active" data-planet="0" aria-pressed="true">Terra Petra</button>
    <button type="button" data-planet="1" aria-pressed="false">Aethera</button>
    <button type="button" data-planet="2" aria-pressed="false">Pyra</button>
    <button type="button" data-planet="3" aria-pressed="false">Vesper</button>
</nav>
<div id="hint">Click the flacon to transmute</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const VARIANTS = [
    { name: 'Terra Petra', kicker: 'Lacquered noir flacon', description: 'Obsidian glass crowned with polished gold — the mineral heart of stone, amber and sun-baked earth.', accentA: '236, 197, 120', accentB: '186, 132, 58' },
    { name: 'Aethera', kicker: 'Oceanic dreamworld', description: 'Abyssal blue glass veined with suspended currents, crowned in pale silver — a tide held perfectly still.', accentA: '84, 226, 255', accentB: '96, 118, 255' },
    { name: 'Pyra', kicker: 'Living furnace', description: 'Charcoal crystal split by molten veins, breathing embers through every fracture, capped in burnt bronze.', accentA: '255, 132, 44', accentB: '255, 45, 86' },
    { name: 'Vesper', kicker: 'Crystalline night', description: 'Faceted violet crystal storing starlight, releasing it through cyan seams beneath a chrome-violet crown.', accentA: '177, 116, 255', accentB: '76, 230, 255' }
];

const TAU = Math.PI * 2;
const isCompact = window.matchMedia('(max-width: 760px)').matches;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const container = document.getElementById('canvas-container');
const planetButtons = Array.from(document.querySelectorAll('[data-planet]'));
const planetName = document.getElementById('planet-name');
const planetKicker = document.getElementById('planet-kicker');
const planetDescription = document.getElementById('planet-description');
const transitionMeter = document.getElementById('transition-meter');
const transitionMeterFill = document.getElementById('transition-meter-fill');
const autoCycleInput = document.getElementById('auto-cycle');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
function responsivePixelRatio() { return Math.min(window.devicePixelRatio || 1, isCompact ? 1.45 : 1.85); }
function responsiveCameraZ() {
    const aspect = window.innerWidth / window.innerHeight;
    if (aspect < 0.66) return 11.4;
    if (aspect < 0.95) return 10.2;
    return 9.2;
}
renderer.setPixelRatio(responsivePixelRatio());
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050308, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050308, 0.013);

const camera = new THREE.PerspectiveCamera(39, window.innerWidth / window.innerHeight, 0.08, 90);
camera.position.set(0, 0.7, responsiveCameraZ());

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.enablePan = false;
controls.enableZoom = true;
controls.zoomSpeed = 0.72;
controls.minDistance = 6.0;
controls.maxDistance = 13.5;
controls.minPolarAngle = Math.PI * 0.14;
controls.maxPolarAngle = Math.PI * 0.86;
controls.autoRotate = !prefersReducedMotion;
controls.autoRotateSpeed = 0.32;
controls.target.set(0, 0.45, 0);
controls.update();

/* ---- zoom guard (same as before) ---- */
const guardedCameraOffset = new THREE.Vector3();
const activeTouchPointers = new Set();
let intendedOrbitRadius = THREE.MathUtils.clamp(camera.position.distanceTo(controls.target), controls.minDistance, controls.maxDistance);
let manualZoomCaptureFrames = 0;
let middleButtonDollyActive = false;
function beginManualZoomCapture(n = 12) { manualZoomCaptureFrames = Math.max(manualZoomCaptureFrames, n); }
renderer.domElement.addEventListener('wheel', () => beginManualZoomCapture(14), { passive: true, capture: true });
renderer.domElement.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') { activeTouchPointers.add(e.pointerId); if (activeTouchPointers.size >= 2) beginManualZoomCapture(18); }
    if (e.button === 1) { middleButtonDollyActive = true; beginManualZoomCapture(18); }
}, { passive: true, capture: true });
renderer.domElement.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch' && activeTouchPointers.size >= 2) beginManualZoomCapture(18);
    if (middleButtonDollyActive) beginManualZoomCapture(18);
}, { passive: true, capture: true });
function endZoomPointer(e) {
    if (e.pointerType === 'touch') { activeTouchPointers.delete(e.pointerId); if (activeTouchPointers.size > 0) beginManualZoomCapture(8); }
    if (e.button === 1) { middleButtonDollyActive = false; beginManualZoomCapture(8); }
}
renderer.domElement.addEventListener('pointerup', endZoomPointer, { passive: true, capture: true });
renderer.domElement.addEventListener('pointercancel', endZoomPointer, { passive: true, capture: true });
renderer.domElement.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'touch') activeTouchPointers.delete(e.pointerId);
    if (e.buttons === 0) middleButtonDollyActive = false;
}, { passive: true, capture: true });
function guardOrbitRadius() {
    guardedCameraOffset.copy(camera.position).sub(controls.target);
    let r = guardedCameraOffset.length();
    if (!Number.isFinite(r) || r < 1e-6) { guardedCameraOffset.set(0, 0.23, 1).normalize(); r = intendedOrbitRadius; }
    if (manualZoomCaptureFrames > 0) {
        intendedOrbitRadius = THREE.MathUtils.clamp(r, controls.minDistance, controls.maxDistance);
        manualZoomCaptureFrames -= 1;
        return;
    }
    if (Math.abs(r - intendedOrbitRadius) > 1e-5) {
        guardedCameraOffset.multiplyScalar(1 / r);
        camera.position.copy(controls.target).addScaledVector(guardedCameraOffset, intendedOrbitRadius);
        camera.lookAt(controls.target);
    }
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.32, 0.5);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ================= GLSL chunks ================= */
const noiseGLSL = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float saturate(float v){return clamp(v,0.0,1.0);}
    vec3 safeNormalize(vec3 v){return v*inversesqrt(max(dot(v,v),1e-12));}
    vec3 sanitizeVec3(vec3 v, vec3 f){ bool bad=any(notEqual(v,v))||any(greaterThan(abs(v),vec3(1e5))); return bad?f:v; }
    vec3 limitLuminance(vec3 color, float maxL){ vec3 c=max(sanitizeVec3(color,vec3(0.0)),vec3(0.0)); float l=dot(c,vec3(0.2126,0.7152,0.0722)); return c*min(1.0,maxL/max(l,1e-5)); }
    float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z);
        vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m*=m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
`;

const bottleGLSL = `
    const float B_YMIN = -2.05;
    const float B_YMAX = 3.10;

    vec3 presetBody(float preset, vec3 wp, vec3 n, float t) {
        vec3 dir = safeNormalize(vec3(wp.x * 0.55, wp.y * 0.38, wp.z * 0.55) + vec3(0.001));
        if (preset < 0.5) {                       /* noir lacquer */
            float grain = snoise(dir * 6.0 + vec3(0.0, t * 0.02, 0.0));
            vec3 base = vec3(0.013, 0.011, 0.010);
            base += vec3(0.05, 0.038, 0.02) * pow(max(grain, 0.0), 2.0) * 0.55;
            base += vec3(0.022, 0.017, 0.010) * smoothstep(0.3, 1.0, n.y * 0.5 + 0.5);
            return base;
        } else if (preset < 1.5) {                /* oceanic glass */
            float current = snoise(dir * 3.5 + vec3(-t * 0.05, t * 0.02, t * 0.04));
            float ribbon = sin(wp.y * 6.0 + snoise(dir * 5.0 + vec3(t * 0.03)) * 1.6 - t * 0.30);
            vec3 abyss = vec3(0.003, 0.020, 0.090);
            vec3 ocean = vec3(0.010, 0.260, 0.620);
            vec3 cyan  = vec3(0.050, 0.850, 1.150);
            vec3 c = mix(abyss, ocean, current * 0.5 + 0.5);
            c = mix(c, cyan, pow(max(ribbon, 0.0), 3.0) * 0.5);
            return c;
        } else if (preset < 2.5) {                /* molten charcoal */
            float crust = snoise(dir * 3.0 + vec3(t * 0.015, 0.0, 0.0));
            float detail = abs(snoise(dir * 7.5 - vec3(0.0, t * 0.04, 0.0)));
            float crack = 1.0 - smoothstep(0.03, 0.16, detail);
            crack *= smoothstep(-0.3, 0.5, crust);
            vec3 charcoal = mix(vec3(0.012, 0.008, 0.010), vec3(0.10, 0.03, 0.02), crust * 0.5 + 0.5);
            vec3 molten = mix(vec3(1.30, 0.05, 0.002), vec3(1.50, 0.62, 0.06), crack);
            return charcoal + molten * crack * 1.35;
        }
        /* violet crystal */
        float facet = floor((snoise(dir * 4.2) * 0.5 + 0.5) * 6.0) / 6.0;
        float seamN = abs(snoise(dir * 8.0 + vec3(0.0, t * 0.02, 0.0)));
        float seam = 1.0 - smoothstep(0.02, 0.12, seamN);
        vec3 night = vec3(0.020, 0.008, 0.100);
        vec3 violet = vec3(0.320, 0.050, 0.720);
        vec3 amethyst = vec3(0.800, 0.160, 1.100);
        vec3 cyan = vec3(0.030, 0.950, 1.300);
        vec3 c = mix(night, violet, facet);
        c = mix(c, amethyst, smoothstep(0.6, 0.95, facet) * 0.7);
        c += cyan * seam * 0.9;
        return c;
    }

    vec3 presetAccent(float preset) {
        if (preset < 0.5) return vec3(1.00, 0.72, 0.30);
        if (preset < 1.5) return vec3(0.30, 0.85, 1.05);
        if (preset < 2.5) return vec3(1.15, 0.38, 0.06);
        return vec3(0.62, 0.32, 1.05);
    }

    vec3 presetCap(float preset) {
        if (preset < 0.5) return vec3(1.05, 0.72, 0.30);
        if (preset < 1.5) return vec3(0.72, 0.86, 1.00);
        if (preset < 2.5) return vec3(0.80, 0.36, 0.12);
        return vec3(0.66, 0.54, 0.95);
    }
`;

/* ================= shared uniforms ================= */
const shared = {
    uTime: { value: 0 },
    uFromPreset: { value: 0 },
    uToPreset: { value: 0 },
    uTransition: { value: 0 },
    uTransitionEnergy: { value: 0 }
};
function sharedUniforms(extra = {}) {
    return Object.assign({
        uTime: shared.uTime,
        uFromPreset: shared.uFromPreset,
        uToPreset: shared.uToPreset,
        uTransition: shared.uTransition,
        uTransitionEnergy: shared.uTransitionEnergy
    }, extra);
}

/* ================= backdrop: nebula + stars ================= */
const nebula = new THREE.Mesh(
    new THREE.SphereGeometry(45, 48, 32),
    new THREE.ShaderMaterial({
        uniforms: { uTime: shared.uTime },
        vertexShader: `varying vec3 vDirection; void main(){ vDirection=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
            ${noiseGLSL}
            uniform float uTime; varying vec3 vDirection;
            void main(){
                vec3 d=safeNormalize(vDirection);
                float broad=snoise(d*1.7+vec3(0.0,uTime*0.006,0.0));
                float fil=snoise(d*4.0-vec3(uTime*0.004,0.0,0.0));
                float cloud=smoothstep(0.12,0.88,broad*0.7+fil*0.3);
                float horizon=pow(max(1.0-abs(d.y),0.0),4.0);
                vec3 midnight=vec3(0.004,0.002,0.008);
                vec3 wine=vec3(0.09,0.03,0.06);
                vec3 blue=vec3(0.02,0.03,0.09);

function sampleSurface(geometries, weights, total) {
    const positions = [], normals = [];
    const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
    const na = new THREE.Vector3(), nb = new THREE.Vector3(), nc = new THREE.Vector3();
    const ab = new THREE.Vector3(), ac = new THREE.Vector3();
    geometries.forEach((geo, gi) => {
        const count = Math.round(total * weights[gi]);
        const pos = geo.attributes.position, nor = geo.attributes.normal;
        const triCount = pos.count / 3;
        const prefix = new Float64Array(triCount + 1);
        for (let t = 0; t < triCount; t++) {
            va.fromBufferAttribute(pos, t*3); vb.fromBufferAttribute(pos, t*3+1); vc.fromBufferAttribute(pos, t*3+2);
            ab.subVectors(vb, va); ac.subVectors(vc, va);
            prefix[t+1] = prefix[t] + ab.cross(ac).length() * 0.5;
        }
        const totalArea = prefix[triCount] || 1;
        for (let i = 0; i < count; i++) {
            const target = Math.random() * totalArea;
            let lo = 0, hi = triCount;
            while (lo < hi) { const mid = (lo + hi) >> 1; if (prefix[mid+1] < target) lo = mid + 1; else hi = mid; }
            const t = lo;
            va.fromBufferAttribute(pos, t*3); vb.fromBufferAttribute(pos, t*3+1); vc.fromBufferAttribute(pos, t*3+2);
            na.fromBufferAttribute(nor, t*3); nb.fromBufferAttribute(nor, t*3+1); nc.fromBufferAttribute(nor, t*3+2);
            let r1 = Math.random(), r2 = Math.random();
            const sr1 = Math.sqrt(r1);
            const wA = 1 - sr1, wB = sr1 * (1 - r2), wC = sr1 * r2;
            positions.push(
                va.x*wA + vb.x*wB + vc.x*wC,
                va.y*wA + vb.y*wB + vc.y*wC,
                va.z*wA + vb.z*wB + vc.z*wC
            );
            normals.push(
                na.x*wA + nb.x*wB + nc.x*wC,
                na.y*wA + nb.y*wB + nc.y*wC,
                na.z*wA + nb.z*wB + nc.z*wC
            );
        }
    });
    return { positions: new Float32Array(positions), normals: new Float32Array(normals), count: positions.length / 3 };
}

            float glow = exp(-d * 8.6);
            float core = (1.0 - smoothstep(0.0, 0.25, d)) * vCore;
            gl_FragColor = vec4(vColor * (glow * 0.9 + core * 0.45), clamp(vAlpha * (glow * 0.75 + core * 0.3), 0.0, 0.18));
        }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const surgeParticles = new THREE.Points(particleGeometry, particleMaterial);
surgeParticles.renderOrder = 5;
surgeParticles.visible = false;
bottleGroup.add(surgeParticles);

/* ---- filaments ---- */
const filamentCount = isCompact ? 2600 : 5200;
const fsurf = sampleSurface([bodyGeometry, capGeometry], [0.8, 0.2], filamentCount);
const filamentGeometry = new THREE.BufferGeometry();
const filamentRandom = new Float32Array(fsurf.count * 4);
for (let i = 0; i < fsurf.count * 4; i++) filamentRandom[i] = Math.random();
filamentGeometry.setAttribute('position', new THREE.BufferAttribute(fsurf.positions, 3));
filamentGeometry.setAttribute('normal', new THREE.BufferAttribute(fsurf.normals, 3));
filamentGeometry.setAttribute('aRandom', new THREE.BufferAttribute(filamentRandom, 4));
filamentGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0.5, 0), 6.0);

const filamentMaterial = new THREE.ShaderMaterial({
    uniforms: sharedUniforms({ uPixelRatio: { value: renderer.getPixelRatio() } }),
    vertexShader: `
        ${noiseGLSL}
        ${bottleGLSL}
        ${sweepVertexGLSL}
        uniform float uTime; uniform float uTransition; uniform float uTransitionEnergy; uniform float uPixelRatio;
        attribute vec4 aRandom;
        varying vec3 vColor; varying float vAlpha; varying float vPulse;
        void main(){
            vec3 nW = safeNormalize(mat3(modelMatrix) * normal);
            vec4 wp4 = modelMatrix * vec4(position, 1.0);
            float delayed = clamp(uTransition + (aRandom.w - 0.5) * 0.075, 0.0, 1.0);
            float coord = sweepCoordinate(wp4.xyz, uTime);
            float scan = mix(-2.05, 3.10, delayed);
            float morph = 1.0 - smoothstep(scan - 0.12, scan + 0.12, coord);
            float front = exp(-abs(coord - scan) * 16.0);
            float ray = step(0.72, aRandom.w);
            float pulse = front * ray;
            float wave = sin(aRandom.x * 22.0 + uTime * (5.0 + aRandom.y * 2.0));
            vec3 wp = wp4.xyz;
            wp += nW * pulse * (0.12 + aRandom.x * 0.5);
            wp += safeNormalize(cross(nW, vec3(0.0,1.0,0.0)+vec3(0.002))) * pulse * wave * (0.08 + aRandom.y * 0.22);
            vec4 mv = viewMatrix * vec4(wp, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = (0.6 + aRandom.x * 1.4 + pulse * 0.8) * uPixelRatio * (29.0 / max(1.0, -mv.z));
            vec3 accent = mix(presetAccent(uFromPreset), presetAccent(uToPreset), morph);
            vColor = mix(accent, vec3(1.1), aRandom.z * 0.35);
            vAlpha = clamp(front * uTransitionEnergy * (0.014 + aRandom.w * 0.045), 0.0, 0.06);
            vPulse = pulse;
        }`,
    fragmentShader: `
        varying vec3 vColor; varying float vAlpha; varying float vPulse;
        void main(){
            vec2 uv = gl_PointCoord - 0.5; float d = length(uv); if (d > 0.5) discard;
            float core = exp(-d * 15.0);
            float glow = exp(-d * 8.2) * (0.12 + vPulse * 0.05);
            gl_FragColor = vec4(vColor * (core + glow), clamp(vAlpha * (core + glow), 0.0, 0.08));
        }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const filaments = new THREE.Points(filamentGeometry, filamentMaterial);
filaments.renderOrder = 6;
filaments.visible = false;
bottleGroup.add(filaments);

/* ================= stage glow ================= */
const stageMaterial = new THREE.ShaderMaterial({
    uniforms: sharedUniforms(),
    vertexShader: `varying vec2 vLocal; void main(){ vLocal = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        ${noiseGLSL}
        ${bottleGLSL}
        uniform float uFromPreset; uniform float uToPreset; uniform float uTransition; uniform float uTransitionEnergy;
        varying vec2 vLocal;
        void main(){
            float r = length(vLocal) / 3.4;
            float fade = pow(max(1.0 - r, 0.0), 2.2);
            vec3 accent = mix(presetAccent(uFromPreset), presetAccent(uToPreset), smoothstep(0.2, 0.8, uTransition));
            vec3 color = accent * fade * (0.10 + uTransitionEnergy * 0.30);
            gl_FragColor = vec4(color, 1.0);
        }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const stage = new THREE.Mesh(new THREE.CircleGeometry(3.4, 64), stageMaterial);
stage.rotation.x = -Math.PI / 2;
stage.position.y = -2.02;
stage.renderOrder = 0;
scene.add(stage);

/* ================= ambient dust arcs ================= */
const arcCount = isCompact ? 1000 : 1900;
const arcGeometry = new THREE.BufferGeometry();
{
    const pos = new Float32Array(arcCount * 3), rnd = new Float32Array(arcCount * 2);
    for (let i = 0; i < arcCount; i++) {
        const a = Math.random() * TAU;
        const r = THREE.MathUtils.lerp(3.2, 5.6, Math.pow(Math.random(), 0.72));
        pos[i*3] = Math.cos(a) * r; pos[i*3+1] = THREE.MathUtils.randFloatSpread(1.6) + 0.4; pos[i*3+2] = Math.sin(a) * r;
        rnd[i*2] = Math.random(); rnd[i*2+1] = Math.random();
    }
    arcGeometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    arcGeometry.setAttribute('aRandom', new THREE.BufferAttribute(rnd, 2));
}
const arcMaterial = new THREE.ShaderMaterial({
    uniforms: { uTime: shared.uTime, uPixelRatio: { value: renderer.getPixelRatio() }, uTransitionEnergy: shared.uTransitionEnergy },
    vertexShader: `
        uniform float uTime; uniform float uPixelRatio; uniform float uTransitionEnergy;
        attribute vec2 aRandom; varying float vAlpha; varying vec3 vColor;
        void main(){
            vec3 p = position;
            float angle = uTime * (0.035 + aRandom.x * 0.055);
            float s = sin(angle), c = cos(angle);
            p.xz = mat2(c, -s, s, c) * p.xz;
            p.y += sin(uTime * 0.45 + aRandom.y * 13.0 + length(p.xz)) * 0.13;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = (0.7 + aRandom.x * 1.5) * uPixelRatio * (25.0 / max(1.0, -mv.z));
            vAlpha = (0.05 + aRandom.y * 0.15) * (1.0 - uTransitionEnergy * 0.52);
            vColor = mix(vec3(0.35, 0.3, 0.9), vec3(0.9, 0.55, 0.3), aRandom.x);
        }`,
    fragmentShader: `
        varying float vAlpha; varying vec3 vColor;
        void main(){
            vec2 uv = gl_PointCoord - 0.5; float d = length(uv); if (d > 0.5) discard;
            float glow = exp(-d * 7.0);
            gl_FragColor = vec4(vColor * glow, vAlpha * glow);
        }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(arcGeometry, arcMaterial));

/* ================= portal shockwave ================= */
const portalUniforms = sharedUniforms({
    uFromAccent: { value: new THREE.Color(1.0, 0.78, 0.42) },
    uToAccent: { value: new THREE.Color(1.0, 0.78, 0.42) }
});
const portalPlane = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 6.2, 1, 1), new THREE.ShaderMaterial({
    uniforms: portalUniforms,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        uniform float uTime; uniform float uTransition; uniform float uTransitionEnergy;
        uniform vec3 uFromAccent; uniform vec3 uToAccent;
        varying vec2 vUv;
        float ringLine(float r, float t, float w){ return exp(-abs(r - t) / max(w, 0.0001)); }
        void main(){
            vec2 p = (vUv - 0.5) * 2.0;
            float radius = length(p); float angle = atan(p.y, p.x);
            float burst = exp(-pow((uTransition - 0.52) / 0.105, 2.0));
            float progress = smoothstep(0.37, 0.72, uTransition);
            float ringRadius = mix(0.18, 1.30, progress)
                + sin(angle * 8.0 - uTime * 4.0) * 0.022
                + sin(angle * 3.0 + uTime * 2.4) * 0.014;
            float shock = ringLine(radius, ringRadius, 0.017) * burst;
            float echo = ringLine(radius, ringRadius * 0.72, 0.013) * burst * 0.42;
            float lens = exp(-radius * radius * 7.5) * burst;
            vec3 color = mix(uFromAccent, uToAccent, smoothstep(0.28, 0.74, uTransition));
            vec3 secondary = mix(vec3(0.03, 0.78, 1.0), vec3(0.82, 0.08, 0.96), smoothstep(0.30, 0.70, uTransition));
            vec3 fc = color * shock * 0.58 + secondary * echo * 0.34 + mix(color, secondary, 0.5) * lens * 0.055;
            float alpha = (shock * 0.105 + echo * 0.055 + lens * 0.020) * (1.0 - smoothstep(1.40, 1.62, radius));
            if (alpha < 0.0015) discard;
            gl_FragColor = vec4(fc, clamp(alpha, 0.0, 0.12));
        }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide
}));
portalPlane.position.y = 0.5;
portalPlane.renderOrder = 8;
portalPlane.visible = false;
scene.add(portalPlane);

/* ================= transition state machine ================= */
const transitionState = {
    active: false, from: 0, to: 0, queued: null, startTime: 0,
    duration: prefersReducedMotion ? 0.82 : 1.28,
    raw: 0, eased: 0, energy: 0, current: 0, settledAt: 0
};
function cinematicEase(v) {
    const x = THREE.MathUtils.clamp(v, 0, 1);
    return x < 0.5 ? 0.5 * Math.pow(x * 2, 1.22) : 1 - 0.5 * Math.pow((1 - x) * 2, 1.22);
}
function transitionEnergy(e) {
    const p = THREE.MathUtils.clamp(e, 0, 1);
    const energy = Math.pow(Math.max(0, Math.sin(Math.PI * p)), 1.35);
    return Number.isFinite(energy) ? energy : 0;
}
function accentStringToColor(value) {
    const ch = value.split(',').map(p => Number(p.trim()) / 255);
    return new THREE.Color(ch[0] || 0.2, ch[1] || 0.7, ch[2] || 1);
}
function setDocumentAccent(i) {
    document.documentElement.style.setProperty('--accent-a', VARIANTS[i].accentA);
    document.documentElement.style.setProperty('--accent-b', VARIANTS[i].accentB);
}
function updateCopy(i, transmuting = false) {
    planetKicker.textContent = transmuting ? `Pouring into ${VARIANTS[i].kicker.toLowerCase()}` : VARIANTS[i].kicker;
    planetName.textContent = VARIANTS[i].name;
    planetDescription.textContent = VARIANTS[i].description;
}
function updateButtons(current, target = null) {
    planetButtons.forEach(b => {
        const i = Number(b.dataset.planet);
        const isCurrent = i === current && target === null;
        const isTarget = target !== null && i === target;
        b.classList.toggle('is-active', isCurrent);
        b.classList.toggle('is-target', isTarget);
        b.setAttribute('aria-pressed', String(isCurrent || isTarget));
    });
}
function beginTransition(targetIndex, now) {
    const t = (targetIndex + VARIANTS.length) % VARIANTS.length;
    if (transitionState.active) { transitionState.queued = t; return; }
    if (t === transitionState.current) return;

    transitionState.active = true;
    transitionState.from = transitionState.current;
    transitionState.to = t;
    transitionState.startTime = now;
    transitionState.raw = transitionState.eased = transitionState.energy = 0;

    shared.uFromPreset.value = transitionState.from;
    shared.uToPreset.value = t;
    shared.uTransition.value = 0;
    shared.uTransitionEnergy.value = 0;

    labelUniforms.uTexFrom.value = labelTextures[transitionState.from];
    labelUniforms.uTexTo.value = labelTextures[t];
    labelUniforms.uTintFrom.value.copy(LABEL_TINTS[transitionState.from]);
    labelUniforms.uTintTo.value.copy(LABEL_TINTS[t]);

    portalUniforms.uFromAccent.value.copy(accentStringToColor(VARIANTS[transitionState.from].accentA));
    portalUniforms.uToAccent.value.copy(accentStringToColor(VARIANTS[t].accentB));

    updateCopy(t, true);
    updateButtons(transitionState.current, t);
    setDocumentAccent(t);
    transitionMeter.classList.add('is-active');
    transitionMeterFill.style.width = '0%';
}
function settleTransition(now) {
    transitionState.current = transitionState.to;
    transitionState.active = false;
    transitionState.energy = 0;
    transitionState.settledAt = now;
    shared.uFromPreset.value = transitionState.current;
    shared.uToPreset.value = transitionState.current;
    shared.uTransition.value = 0;
    shared.uTransitionEnergy.value = 0;
    labelUniforms.uTexFrom.value = labelTextures[transitionState.current];
    labelUniforms.uTexTo.value = labelTextures[transitionState.current];
    labelUniforms.uTintFrom.value.copy(LABEL_TINTS[transitionState.current]);
    labelUniforms.uTintTo.value.copy(LABEL_TINTS[transitionState.current]);
    updateCopy(transitionState.current, false);
    updateButtons(transitionState.current, null);
    setDocumentAccent(transitionState.current);
    transitionMeter.classList.remove('is-active');
    transitionMeterFill.style.width = '100%';
    if (transitionState.queued !== null) {
        const q = transitionState.queued;
        transitionState.queued = null;
        if (q !== transitionState.current) beginTransition(q, now + 0.001);
    }
}
function updateTransition(now) {
    if (!transitionState.active) return;
    const raw = THREE.MathUtils.clamp((now - transitionState.startTime) / transitionState.duration, 0, 1);
    const eased = cinematicEase(raw);
    const energy = transitionEnergy(eased);
    transitionState.raw = raw; transitionState.eased = eased; transitionState.energy = energy;
    shared.uTransition.value = eased;
    shared.uTransitionEnergy.value = energy;
    transitionMeterFill.style.width = `${(raw * 100).toFixed(2)}%`;
    if (raw >= 1) settleTransition(now);
}

let latestTime = 0;
planetButtons.forEach(b => b.addEventListener('click', () => beginTransition(Number(b.dataset.planet), latestTime)));
window.addEventListener('keydown', (e) => {
    const tag = document.activeElement?.tagName?.toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    const base = transitionState.active ? transitionState.to : transitionState.current;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); beginTransition(base + 1, latestTime); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); beginTransition(base - 1, latestTime); }
});

/* click the bottle itself to transmute */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; }, { passive: true });
renderer.domElement.addEventListener('pointerup', (e) => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
    pointerNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(pointerNDC, camera);
    if (raycaster.intersectObjects([bodyMesh, capMesh, neckMesh, labelMesh], false).length > 0) {
        beginTransition(transitionState.current + 1, latestTime);
    }
}, { passive: true });

function handleResize() {
    const w = window.innerWidth, h = window.innerHeight, pr = responsivePixelRatio();
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pr); renderer.setSize(w, h);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    particleMaterial.uniforms.uPixelRatio.value = pr;
    filamentMaterial.uniforms.uPixelRatio.value = pr;
    starMaterial.uniforms.uPixelRatio.value = pr;
    arcMaterial.uniforms.uPixelRatio.value = pr;
}
window.addEventListener('resize', handleResize, { passive: true });

/* ================= loop ================= */
const clock = new THREE.Clock();
const AUTO_HOLD_SECONDS = prefersReducedMotion ? 6.0 : 4.2;
const idleRotation = 0.05;

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.04);
    const time = clock.elapsedTime;
    latestTime = time;
    updateTransition(time);

    const energy = transitionState.energy;
    shared.uTime.value = time;

    surgeParticles.visible = transitionState.active;
    filaments.visible = transitionState.active;
    portalPlane.visible = transitionState.active;
    if (portalPlane.visible) portalPlane.quaternion.copy(camera.quaternion);

    bottleGroup.rotation.y += (idleRotation + energy * 0.14) * delta;
    bottleGroup.rotation.x = Math.sin(time * 0.12) * 0.015;
    nebula.rotation.y = -time * 0.00045;

    bloomPass.strength = 0.55 + energy * 0.06;
    bloomPass.radius = 0.32 + energy * 0.025;
    bloomPass.threshold = 0.5 + energy * 0.025;

    if (autoCycleInput.checked && !transitionState.active && time - transitionState.settledAt > AUTO_HOLD_SECONDS) {
        beginTransition(transitionState.current + 1, time);
    }

    controls.update();
    guardOrbitRadius();
    composer.render();
}

setDocumentAccent(0);
updateCopy(0, false);
updateButtons(0, null);
handleResize();
animate();
</script>
</body>
